<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stroke</title>
</head>
<body>
    <svg width="160" height="280" xmlns="http://www.w3.org/2000/svg" version="1.1">
        <polyline points="40 60 80 20 120 60" stroke="black" stroke-width="20"
            stroke-linecap="butt" fill="none" stroke-linejoin="miter"/>

        <polyline points="40 140 80 100 120 140" stroke="black" stroke-width="20"
            stroke-linecap="round" fill="none" stroke-linejoin="round"/>

        <polyline points="40 220 80 180 120 220" stroke="black" stroke-width="20"
            stroke-linecap="round" fill="none" stroke-linejoin="bevel"/>
    </svg>
    <svg width="160" height="280" xmlns="http://www.w3.org/2000/svg" version="1.1">
        <!-- <polyline points="40 60 80 20 120 60" stroke="black" stroke-width="20"
            stroke-linecap="butt" fill="none" stroke-linejoin="miter"/> -->
        <path d="M40 60 L80 20 L120 60" stroke="black" stroke-width="20" 
            fill="none"/>

        <!-- <polyline points="40 140 80 100 120 140" stroke="black" stroke-width="20"
            stroke-linecap="round" fill="none" stroke-linejoin="round"/> -->
        <path d="M40 140 L80 100 120 140" stroke="black" stroke-width="20" fill="none"
            stroke-linecap="round" stroke-linejoin="round" />

        <polyline points="40 220 80 180 120 220" stroke="black" stroke-width="20"
            stroke-linecap="round" fill="none" stroke-linejoin="bevel"/>
        <path d="M40 220 L80 180 L120 220" stroke="black" stroke-width="20" fill="none"
            stroke-linecap="round" stroke-linejoin="bevel"/>
    </svg>
</body>
</html>
