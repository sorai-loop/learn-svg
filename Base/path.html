<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>path</title>
</head>
<body>
    <svg viewbox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
        <path stroke="red" fill="blue" d="M 0,0 l 10,0 v10 h-10 z" />
    </svg>
    <!-- 相対座標 -->
    <svg viewbox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
        <path stroke="red" fill="blue" d="M 10,10 c0,10 10,10 10,0" />
    </svg>
    <!-- 絶対座標 -->
    <svg viewbox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
        <path stroke="red" fill="blue" d="M 10,10 C10,20 20,20 20,10" />
    </svg>
    <svg viewbox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
        <path stroke="red" fill="blue" d="M 10,10 C10,20 20,20 20,10 S 30,20 30,10" />
    </svg>
    <svg viewbox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
        <path stroke="red" fill="blue" d="M 0,0 l 10,0 v10 h-10 z" />
    </svg>
    <svg width="320" height="320" xmlns="http://www.w3.org/2000/svg">
        <path
            d="M 10 315
            L 110 215
            A 30 50 0 0 1 162.55 162.45
            L 172.55 152.45
            A 30 50 -45 0 1 215.1 109.9
            L 315 10"
            stroke="black"
            fill="green"
            stroke-width="2"
            fill-opacity="0.5" />
    </svg>
</body>
</html>
