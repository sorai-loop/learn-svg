<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stroke-dasharry</title>
</head>
<body>
    <style>
        :root {
            --path-length: 400;
        }

        .path-animation {
            stroke-dasharray: 400 400;
            stroke-dashoffset: 400;
  
            animation: drawAndErase 3s ease-in-out infinite;
        }

        @keyframes drawAndErase {
            0% {
                stroke-dashoffset: 400;
            }
            50% {
                stroke-dashoffset: 0;
            }
            100% {
                stroke-dashoffset: -400;
            }
        }
    </style>
    <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
        <path class="path-animation" stroke="red" stroke-width="5" stroke-dasharray="400" stroke-dashoffset="100" fill="blue" d="M 10 10 H 90 V 90 H 10  Z" />
    </svg>
</body>
</html>
